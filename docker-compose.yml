version: '3.8'

services:
  movie-streaming:
    build: .
    container_name: movie-streaming
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5992
      - APP_URL=https://watch.pallabdev.in
    labels:
      caddy: watch.pallabdev.in
      caddy.reverse_proxy: "{{upstreams 5992}}"
    networks:
      - caddy_net

networks:
  caddy_net:
    name: caddy_net
    external: true
