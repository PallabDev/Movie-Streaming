services:
  movie-streaming:
    build: .
    container_name: movie-streaming
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-5992}
      - APP_URL=${APP_URL:-https://watch.pallabdev.in}
    labels:
      caddy: ${DOMAIN:-watch.pallabdev.in}
      caddy.reverse_proxy: '{{upstreams ${PORT:-5992}}}'
      caddy.reverse_proxy.flush_interval: '0'
      caddy.reverse_proxy.buffer_requests: 'off'
      caddy.reverse_proxy.buffer_responses: 'off'
    networks:
      - caddy_net

networks:
  caddy_net:
    name: caddy_net
    external: true
